name: Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare web assets
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html styles.css app.js sw.js manifest.json README.md app/src/main/assets/www/
          mkdir -p app/src/main/assets/www/assets
          cp assets/logo.svg app/src/main/assets/www/assets/logo.svg

      - name: Restore permanent release signing key
        env:
          DOLPHIN_KEYSTORE_B64: ${{ secrets.DOLPHIN_KEYSTORE_B64 }}
          DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
          DOLPHIN_KEY_ALIAS: ${{ secrets.DOLPHIN_KEY_ALIAS }}
          DOLPHIN_KEY_PASSWORD: ${{ secrets.DOLPHIN_KEY_PASSWORD }}
        run: |
          test -n "$DOLPHIN_KEYSTORE_B64"
          echo "$DOLPHIN_KEYSTORE_B64" | base64 --decode > release-keystore.jks

      - name: Build signed release APK
        env:
          DOLPHIN_KEYSTORE_PATH: release-keystore.jks
          DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
          DOLPHIN_KEY_ALIAS: ${{ secrets.DOLPHIN_KEY_ALIAS }}
          DOLPHIN_KEY_PASSWORD: ${{ secrets.DOLPHIN_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: rc-dolphin-ai-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
