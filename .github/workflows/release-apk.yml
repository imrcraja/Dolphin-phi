name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare web assets
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html styles.css app.js sw.js manifest.json README.md app/src/main/assets/www/
          mkdir -p app/src/main/assets/www/assets
          cp assets/logo.svg app/src/main/assets/www/assets/logo.svg
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rc-dolphin-ai-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
