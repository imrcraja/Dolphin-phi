plugins { id 'com.android.application' }

android {
    namespace 'com.rcraja.dolphin'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rcraja.dolphin'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("DOLPHIN_KEYSTORE_PATH") ?: "release-keystore.jks"
            def ksStorePassword = System.getenv("DOLPHIN_KEYSTORE_PASSWORD") ?: "dolphin-release-pass"
            def ksAlias = System.getenv("DOLPHIN_KEY_ALIAS") ?: "dolphin-release"
            def ksKeyPassword = System.getenv("DOLPHIN_KEY_PASSWORD") ?: "dolphin-release-pass"

            storeFile file("${project.rootProject.projectDir}/" + ksPath)
            storePassword ksStorePassword
            keyAlias ksAlias
            keyPassword ksKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
