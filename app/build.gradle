plugins { id 'com.android.application' }

android {
    namespace 'com.rcraja.dolphin'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rcraja.dolphin'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            def keystoreFile = file(System.getenv("DOLPHIN_KEYSTORE_PATH") ?: "release-keystore.jks")
            def storePassword = System.getenv("DOLPHIN_KEYSTORE_PASSWORD")
            def keyAlias = System.getenv("DOLPHIN_KEY_ALIAS")
            def keyPassword = System.getenv("DOLPHIN_KEY_PASSWORD")
            if (keystoreFile.exists() && storePassword && keyAlias && keyPassword) {
                storeFile keystoreFile
                this.storePassword storePassword
                this.keyAlias keyAlias
                this.keyPassword keyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
